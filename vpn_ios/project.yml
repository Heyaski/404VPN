name: VPN404
options:
  bundleIdPrefix: co.404studio
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
  groupSortPosition: none

packages:
  # Локальная копия с патчами под Xcode 26 — см. Vendor/WireGuardKit/Package.swift
  WireGuardKit:
    path: Vendor/WireGuardKit

configFiles:
  Debug: Local.xcconfig
  Release: Local.xcconfig

targets:
  VPN404:
    type: application
    platform: iOS
    sources:
      - path: App
      - path: Shared
      - path: Assets.xcassets
    info:
      path: App/Info.generated.plist
      properties:
        CFBundleDisplayName: Overlay
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        # Без объявленной локализации Locale.current схлопывается к английскому
        # даже на русском телефоне — и даты в статистике идут не на том языке
        CFBundleDevelopmentRegion: ru
        CFBundleLocalizations: [ru]
        UILaunchScreen: {}
        UIUserInterfaceStyle: Dark
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        ITSAppUsesNonExemptEncryption: false
        # Базовый URL API — чтобы домен не был зашит в коде
        APIBaseURL: https://404studiotech-miniapp.ru
    entitlements:
      path: App/App.generated.entitlements
      properties:
        com.apple.developer.networking.networkextension: [packet-tunnel-provider]
        com.apple.security.application-groups: [group.co.404studio.vpn]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: co.404studio.vpn
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.0"
        CODE_SIGN_STYLE: Automatic
    dependencies:
      - target: VPN404Tunnel
        embed: true
        codeSign: true

  VPN404Tunnel:
    type: app-extension
    platform: iOS
    sources:
      - path: Tunnel
      - path: Shared
    info:
      path: Tunnel/Info.generated.plist
      properties:
        CFBundleDisplayName: Overlay Tunnel
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.networkextension.packet-tunnel
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).PacketTunnelProvider
    entitlements:
      path: Tunnel/Tunnel.generated.entitlements
      properties:
        com.apple.developer.networking.networkextension: [packet-tunnel-provider]
        com.apple.security.application-groups: [group.co.404studio.vpn]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: co.404studio.vpn.tunnel
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        CODE_SIGN_STYLE: Automatic
    dependencies:
      - package: WireGuardKit
    preBuildScripts:
      - name: Build libwg-go
        basedOnDependencyAnalysis: false
        script: |
          set -e
          export PATH="$PATH:/usr/local/go/bin:/opt/homebrew/bin:/usr/local/bin"
          make -C "$SRCROOT/Vendor/WireGuardKit/Sources/WireGuardKitGo" \
            DESTDIR="$BUILT_PRODUCTS_DIR" \
            BUILDDIR="$DERIVED_FILE_DIR/wireguard-go-bridge"

  VPN404Tests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    settings:
      base:
        SWIFT_VERSION: "5.0"
        # у тестового бандла нет своего Info.plist — с включённой подписью
        # он обязателен, поэтому генерируем автоматически
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: VPN404

schemes:
  VPN404:
    build:
      targets:
        VPN404: all
        VPN404Tunnel: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - VPN404Tests
